groups:
- name: docker_media_alerts
  rules:
  # Docker container restarts >1 in 5m (rate >0.2)
  - alert: DockerContainerHighRestarts
    expr: rate(container_last_seen{name!~"/(POD|)", container_label_restartcount!=""}[5m]) > 0.2
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: 'High restarts on Docker container {{ $labels.name }}'
      description: 'Container {{ $labels.name }} on {{ $labels.instance }} restarted {{ $value | humanize }} times in 5m (restartcount={{ $labels.container_label_restartcount }}).[web:11][web:22][web:26]'

  # High container CPU >80% of host for 5m (non-empty name)
  - alert: ContainerHighCPU
    expr: 100 * rate(container_cpu_usage_seconds_total{name!=""}[5m]) / on(instance) group_left() count(rate(container_cpu_usage_seconds_total{name!=""}[5m])) by (instance) > 80
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: 'High CPU on container {{ $labels.name }} ({{ $value | humanize }}%)'
      description: 'Container {{ $labels.name }} on {{ $labels.instance }} CPU >80% for >5m.[web:17][web:27][web:32]'

  # Traefik issues: High 5xx errors
  - alert: TraefikHigh5xx
    expr: rate(traefik_entrypoint_requests_total{code=~"5\\d\\d"}[5m]) / rate(traefik_entrypoint_requests_total[5m]) * 100 > 5
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: 'Traefik high 5xx on entrypoint {{ $labels.entrypoint }} ({{ $value | humanize }}%)'
      description: '{{ $labels.entrypoint }} has high 5xx error rate on {{ $labels.instance }}.[web:21][web:15]'

  # Traefik high 4xx
  - alert: TraefikHigh4xx
    expr: rate(traefik_entrypoint_requests_total{code=~"4\\d\\d"}[5m]) / rate(traefik_entrypoint_requests_total[5m]) * 100 > 10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: 'Traefik high 4xx on entrypoint {{ $labels.entrypoint }} ({{ $value | humanize }}%)'
      description: '{{ $labels.entrypoint }} has high 4xx error rate on {{ $labels.instance }}.[web:21][web:15]'

  # Prowlarr: assumes exportarr/mediamon metrics; adjust names
  - alert: ProwlarrLowEnabledIndexersRatio
    expr: (prowlarr_indexers_enabled / prowlarr_indexers_total) * 100 < 100
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: 'Prowlarr low enabled indexers ratio ({{ $value | humanize }}%)'
      description: 'Only {{ $value | humanize }}% of indexers enabled; check config on {{ $labels.instance }}.[web:24][web:16]'

  # Missing mount points via node-exporter
  - alert: MissingMediaMountFilmek
    expr: absent(node_filesystem_avail_bytes{mountpoint="/media/filmek"})
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: 'Missing /media/filmek mount'
      description: '/media/filmek not mounted/detected on {{ $labels.instance }}.[web:7][web:8]'

  - alert: MissingMediaMountSorozatok
    expr: absent(node_filesystem_avail_bytes{mountpoint="/media/sorozatok"})
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: 'Missing /media/sorozatok mount'
      description: '/media/sorozatok not mounted/detected on {{ $labels.instance }}.[web:7][web:8]'

  - alert: MissingMediaMountRouter
    expr: absent(node_filesystem_avail_bytes{mountpoint="/media/router"})
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: 'Missing /media/router mount'
      description: '/media/router not mounted/detected on {{ $labels.instance }}.[web:7][web:8]'

  - alert: MissingMediaMountStorage
    expr: absent(node_filesystem_avail_bytes{mountpoint="/media/storage"})
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: 'Missing /media/storage mount'
      description: '/media/storage not mounted/detected on {{ $labels.instance }}.[web:7][web:8]'
