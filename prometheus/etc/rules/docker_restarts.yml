groups:
- name: docker_restarts
  rules:
  - alert: DockerContainerRestarts
    expr: count by (instance, name) (count_over_time(container_last_seen{container_label_restartcount!=""}[30m])) - 1 >= 1
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: 'Docker container {{ $labels.name }} restarted recently'
      description: 'Container {{ $labels.name }} restarted in the last 30 minutes.'