networks:
  proxy:
    driver: bridge
    name: ${TRAEFIK_NETWORK}
services:

#Administration & Management stack
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: ${RESTART_POLICY}
    volumes:
      - ${PORTAINER_LOCALTIME}:/etc/localtime:ro
      - ${DOCKER_SOCK}:${DOCKER_SOCK}:ro
      - ${PORTAINER_DATA}:/data
    ports:
      - ${PORTAINER_PORT}:${PORTAINER_PORT}

  traefik:
    image: traefik
    restart: ${RESTART_POLICY}
    container_name: "traefik"
    command:
      - "--log.level=${TRAEFIK_LOGLEVEL}"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:${TRAEFIK_WEB_PORT}"
      - "--entrypoints.websecure.address=:${TRAEFIK_WEBSECURE_PORT}"
      - "--entrypoints.traefik.address=:${TRAEFIK_DASHBOARD_PORT}"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--certificatesresolvers.${TRAEFIK_RESOLVER}.acme.tlschallenge=true"
      - "--certificatesresolvers.${TRAEFIK_RESOLVER}.acme.caserver=${TRAEFIK_CASERVER}"
      - "--certificatesresolvers.${TRAEFIK_RESOLVER}.acme.email=${TRAEFIK_CASERVER_EMAIL}"
      - "--certificatesresolvers.${TRAEFIK_RESOLVER}.acme.storage=/letsencrypt/${TRAEFIK_ACMESTORAGE}"
      - "--metrics.prometheus=true"
      - "--accesslog=true"
      - "--accesslog.filepath=${TRAEFIK_LOGS_FOLDER}/access.log"
      - "--accesslog.fields.defaultmode=keep"
      - "--accesslog.fields.names.ClientUsername=drop"
      - "--accesslog.fields.headers.defaultmode=keep"
      - "--accesslog.fields.headers.names.User-Agent=keep"
      - "--accesslog.fields.headers.names.Authorization=drop"
      - "--accesslog.fields.headers.names.Content-Type=drop"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
    ports:
      - "${TRAEFIK_WEB_PORT}:${TRAEFIK_WEB_PORT}"
      - "${TRAEFIK_DASHBOARD_PORT}:${TRAEFIK_DASHBOARD_PORT}"
      - "${TRAEFIK_WEBSECURE_PORT}:${TRAEFIK_WEBSECURE_PORT}"
    volumes:
      - "${DOCKER_SOCK}:${DOCKER_SOCK}:ro"
      - "${TRAEFIK_LETSENCRYPT}:/letsencrypt"
      - "${TRAEFIK_FOLDER}:${TRAEFIK_LOGS_FOLDER}"
    networks:
      - "${TRAEFIK_NETWORK}"
      - "default"

