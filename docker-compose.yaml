# Media stack

  plex:
    image: lscr.io/linuxserver/plex
    container_name: plex
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
      - ADVERTISE_IP=http://${DOCKER_HOST_IP}:${PLEX_PORT1}/
    volumes:
      - ${PLEX_CONFIG}:/config
      - ${SERIES_FOLDER}:/${SERIES_FOLDER}
      - ${MOVIES_FOLDER}:/${MOVIES_FOLDER}
    restart: ${RESTART_POLICY}
    ports:
     - ${PLEX_PORT1}:${PLEX_PORT1}/tcp
     - ${PLEX_PORT1}:${PLEX_PORT1}/udp
     - 3005:3005/tcp
     - 8324:8324/tcp
     - 32469:32469/tcp
     - 1900:1900/udp
     - 32410:32410/udp
     - 32412:32412/udp
     - 32413:32413/udp
     - 32414:32414/udp
    networks:
      - "${TRAEFIK_NETWORK}"
    labels:
      - "needs.stop.for.backup=true"
      - "traefik.enable=true"
      - "traefik.http.routers.plex.entrypoints=${TRAEFIK_ENTRYPOINTS}"
      - "traefik.http.services.plex.loadbalancer.server.port=${PLEX_PORT1}"
      - "traefik.http.routers.plex.rule=Host(`${PLEX_SUBDOMAIN}.${TRAEFIK_DOMAIN1}`) || Host(`${PLEX_SUBDOMAIN}.${TRAEFIK_DOMAIN2}`)"
      - "traefik.http.routers.plex.tls.certresolver=${TRAEFIK_RESOLVER}"
      - "traefik.http.routers.plex.tls=true"
  
  scheduler:
    image: mcuadros/ofelia
    container_name: scheduler
    restart: ${RESTART_POLICY}
    depends_on:
      - plextraktsync
    command: daemon --docker
    volumes:
      - ${DOCKER_SOCK}:${DOCKER_SOCK}:ro
    labels:
      ofelia.job-exec.plextraktsync.schedule: "@every 6h"
      ofelia.job-exec.plextraktsync.container: "plextraktsync"
      ofelia.job-exec.plextraktsync.command: "plextraktsync sync"
  
  plextraktsync:
    image: ghcr.io/taxel/plextraktsync
    container_name: plextraktsync
    command: sync
    volumes:
      - ${TRAKT_SYNC_CONFIG}:/app/config
    networks:
      - "${TRAEFIK_NETWORK}"
      - "default"

  tautulli:
    image: ghcr.io/linuxserver/tautulli
    container_name: tautulli
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${TAUTULLI_CONFIG}:/config
    ports:
      - ${TAUTULLI_PORT}:${TAUTULLI_PORT}
    restart: ${RESTART_POLICY}
    networks:
      - "${TRAEFIK_NETWORK}"
      - "default"
    labels:
      - "needs.stop.for.backup=true"
      - "traefik.enable=true"
      - "traefik.http.routers.tautulli.entrypoints=${TRAEFIK_ENTRYPOINTS}"
      - "traefik.http.services.tautulli.loadbalancer.server.port=${TAUTULLI_PORT}"
      - "traefik.http.routers.tautulli.rule=Host(`${TAUTULLI_SUBDOMAIN}.${TRAEFIK_DOMAIN1}`) || Host(`${TAUTULLI_SUBDOMAIN}.${TRAEFIK_DOMAIN2}`)"
      - "traefik.http.routers.tautulli.tls.certresolver=${TRAEFIK_RESOLVER}"
      - "traefik.http.routers.tautulli.tls=true"

  kitana:
    image: pannal/kitana
    container_name: kitana
    command: -B 0.0.0.0:${KITANA_PORT} -p /kitana -P
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${KITANA_CONFIG}:/app/data
    restart: ${RESTART_POLICY}
    ports:
      - ${KITANA_PORT}:${KITANA_PORT}
    networks:
      - "${TRAEFIK_NETWORK}"
      - "default"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kitana.entrypoints=${TRAEFIK_ENTRYPOINTS}"
      - "traefik.http.services.kitana.loadbalancer.server.port=${KITANA_PORT}"
      - "traefik.http.routers.kitana.rule=Host(`${KITANA_SUBDOMAIN}.${TRAEFIK_DOMAIN1}`) || Host(`${KITANA_SUBDOMAIN}.${TRAEFIK_DOMAIN2}`)"
      - "traefik.http.routers.kitana.tls.certresolver=${TRAEFIK_RESOLVER}"
      - "traefik.http.routers.kitana.tls=true"

# Arr stack

  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr
    restart: ${RESTART_POLICY}
    labels:
      - "needs.stop.for.backup=true"
      - "traefik.enable=true"
      - "traefik.http.routers.homarr.entrypoints=${TRAEFIK_ENTRYPOINTS}"
      - "traefik.http.services.homarr.loadbalancer.server.port=${HOMARR_PORT}"
      - "traefik.http.routers.homarr.rule=Host(`${HOMARR_SUBDOMAIN}.${TRAEFIK_DOMAIN1}`) || Host(`${HOMARR_SUBDOMAIN}.${TRAEFIK_DOMAIN2}`)"
      - "traefik.http.routers.homarr.tls.certresolver=${TRAEFIK_RESOLVER}"
      - "traefik.http.routers.homarr.tls=true"
    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARR_ENCRYPTION_KEY}
    volumes:
      - ${HOMARR_CONFIG}:/appdata
      - ${DOCKER_SOCK}:${DOCKER_SOCK}:ro
    ports:
      - ${HOMARR_PORT}:${HOMARR_PORT}
    networks:
      - "${TRAEFIK_NETWORK}"
      - "default"

  radarr:
    container_name: radarr
    restart: ${RESTART_POLICY}
    ports:
      - ${RADARR_PORT}:${RADARR_PORT}
    volumes:
      - ${RADARR_CONFIG}:/config
      - ${MOVIES_FOLDER}:/${MOVIES_FOLDER}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    image: linuxserver/radarr
    networks:
      - "${TRAEFIK_NETWORK}"
      - "default"
    labels:
      - "needs.stop.for.backup=true"
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.entrypoints=${TRAEFIK_ENTRYPOINTS}"
      - "traefik.http.services.radarr.loadbalancer.server.port=${RADARR_PORT}"
      - "traefik.http.routers.radarr.rule=Host(`${RADARR_SUBDOMAIN}.${TRAEFIK_DOMAIN1}`) || Host(`${RADARR_SUBDOMAIN}.${TRAEFIK_DOMAIN2}`)"
      - "traefik.http.routers.radarr.tls.certresolver=${TRAEFIK_RESOLVER}"
      - "traefik.http.routers.radarr.tls=true"

  sonarr:
    container_name: sonarr
    restart: ${RESTART_POLICY}
    ports:
      - ${SONARR_PORT}:${SONARR_PORT}
    volumes:
      - ${SONARR_CONFIG}:/config
      - ${SERIES_FOLDER}:/${SERIES_FOLDER}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    image: linuxserver/sonarr
    networks:
      - "${TRAEFIK_NETWORK}"
      - "default"
    labels:
      - "needs.stop.for.backup=true"
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.entrypoints=${TRAEFIK_ENTRYPOINTS}"
      - "traefik.http.services.sonarr.loadbalancer.server.port=${SONARR_PORT}"
      - "traefik.http.routers.sonarr.rule=Host(`${SONARR_SUBDOMAIN}.${TRAEFIK_DOMAIN1}`) || Host(`${SONARR_SUBDOMAIN}.${TRAEFIK_DOMAIN2}`)"
      - "traefik.http.routers.sonarr.tls.certresolver=${TRAEFIK_RESOLVER}"
      - "traefik.http.routers.sonarr.tls=true"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    labels:
      - "needs.stop.for.backup=true"
    volumes:
      - ${PROWLARR_CONFIG}:/config
    ports:
      - ${PROWLARR_PORT}:${PROWLARR_PORT}
    restart: ${RESTART_POLICY}
    networks:
      - "${TRAEFIK_NETWORK}"
      - "default"

  bazarr:
    image: linuxserver/bazarr
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    labels:
      - "needs.stop.for.backup=true"
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.entrypoints=${TRAEFIK_ENTRYPOINTS}"
      - "traefik.http.services.bazarr.loadbalancer.server.port=${BAZARR_PORT}"
      - "traefik.http.routers.bazarr.rule=Host(`${BAZARR_SUBDOMAIN}.${TRAEFIK_DOMAIN1}`) || Host(`${BAZARR_SUBDOMAIN}.${TRAEFIK_DOMAIN2}`)"
      - "traefik.http.routers.bazarr.tls.certresolver=${TRAEFIK_RESOLVER}"
      - "traefik.http.routers.bazarr.tls=true"
    volumes:
      - ${BAZARR_CONFIG}:/config
      - ${MOVIES_FOLDER}:/${MOVIES_FOLDER}
      - ${SERIES_FOLDER}:/${SERIES_FOLDER}
    ports:
      - ${BAZARR_PORT}:${BAZARR_PORT}
    restart: ${RESTART_POLICY}
    networks:
      - "${TRAEFIK_NETWORK}"
      - "default"

  overseerr:
    image: lscr.io/linuxserver/overseerr
    container_name: overseerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    labels:
      - "needs.stop.for.backup=true"
      - "traefik.enable=true"
      - "traefik.http.routers.overseerr.entrypoints=${TRAEFIK_ENTRYPOINTS}"
      - "traefik.http.services.overseerr.loadbalancer.server.port=${OVERSEERR_PORT}"
      - "traefik.http.routers.overseerr.rule=Host(`${OVERSEERR_SUBDOMAIN}.${TRAEFIK_DOMAIN1}`) || Host(`${OVERSEERR_SUBDOMAIN}.${TRAEFIK_DOMAIN2}`)"
      - "traefik.http.routers.overseerr.tls.certresolver=${TRAEFIK_RESOLVER}"
      - "traefik.http.routers.overseerr.tls=true"
    volumes:
      - ${OVERSEERR_CONFIG}:/config
    ports:
      - ${OVERSEERR_PORT}:${OVERSEERR_PORT}
    restart: ${RESTART_POLICY}
    networks:
      - "${TRAEFIK_NETWORK}"
      - "default"

