# Downloaders

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
      - WEBUI_PORT=${QB_PORT}
    volumes:
      - ${QB_CONFIG}:/config
      - ${SERIES_FOLDER}:/${SERIES_FOLDER}
      - ${MOVIES_FOLDER}:/${MOVIES_FOLDER}
    ports:
      - ${QB_DOWNLOADPORT}:${QB_DOWNLOADPORT}
      - ${QB_DOWNLOADPORT}:${QB_DOWNLOADPORT}/udp
      - ${QB_PORT}:${QB_PORT}
    restart: ${RESTART_POLICY}
    networks:
      - "${TRAEFIK_NETWORK}"
      - "default"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qb.entrypoints=web,websecure"
      - "traefik.http.routers.qb.rule=Host(`${QB_SUBDOMAIN}.${TRAEFIK_DOMAIN1}`) || Host(`${QB_SUBDOMAIN}.${TRAEFIK_DOMAIN2}`)"
      # approproiate header changes
      - "traefik.http.middlewares.qb-headers.headers.customrequestheaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.middlewares.qb-headers.headers.customrequestheaders.Referer="
      - "traefik.http.middlewares.qb-headers.headers.customrequestheaders.Origin="
      - "traefik.http.routers.qb.middlewares=qb-headers"
      # loadbalancer to *not* pass the host header
      - "traefik.http.services.qb.loadbalancer.server.port=${QB_PORT}"
      - "traefik.http.services.qb.loadbalancer.passhostheader=false"
      - "traefik.http.routers.qb.tls.certresolver=${TRAEFIK_RESOLVER}"
      - "traefik.http.routers.qb.tls=true"

#Monitoring stack

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    volumes:
      - ${PROM_CONFIG}/etc/:/etc/prometheus/
      - ${PROM_CONFIG}:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    dns:
      - ${LAN_DNS_SERVER}
    ports:
      - ${PROM_PORT}:${PROM_PORT}
    links:
      - cadvisor:cadvisor
      - alertmanager:alertmanager
    restart: ${RESTART_POLICY}

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    ports:
      - ${NODEEXP_PORT}:${NODEEXP_PORT}
    restart: ${RESTART_POLICY}
    deploy:
      mode: global

  alertmanager:
    container_name: alertmanager
    image: prom/alertmanager
    ports:
      - ${ALERTMANAGER_PORT2}:${ALERTMANAGER_PORT2}
      - ${ALERTMANAGER_PORT1}:${ALERTMANAGER_PORT1}
    volumes:
      - ${ALERTMANAGER_CONFIG}:/etc/alertmanager/
    restart: ${RESTART_POLICY}
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'

  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - ${CADVISOR_PORT}:8080
    restart: ${RESTART_POLICY}
    deploy:
      mode: global

  grafana:
    container_name: grafana
    image: grafana/grafana
    user: "472"
    ports:
      - ${GRAFANA_PORT}:${GRAFANA_PORT}
    volumes:
      - ${GRAFANA_CONFIG}:/var/lib/grafana
      - ${GRAFANA_CONFIG}/provisioning/:/etc/grafana/provisioning/
    env_file:
      - ${GRAFANA_CONFIG}/config.monitoring
    depends_on:
      - prometheus
    restart: ${RESTART_POLICY}

  sonarr-exporter:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: sonarr-exporter
    command: ["sonarr"]
    environment:
      PORT: ${SONARR_METRICS}
      URL: "http://sonarr:${SONARR_PORT}"
      APIKEY: "${SONARR_API}"
      ENABLE_EPISODE_QUALITY_METRICS: "false"
    ports:
      - "${SONARR_METRICS}:${SONARR_METRICS}"
    restart: ${RESTART_POLICY}
    depends_on:
      - sonarr

  radarr-exporter:
    container_name: radarr-exporter
    image: ghcr.io/onedr0p/exportarr:latest
    command: ["radarr"]
    environment:
      PORT: ${RADARR_METRICS}
      URL: "http://radarr:${RADARR_PORT}"
      APIKEY: "${RADARR_API}"
    ports:
      - "${RADARR_METRICS}:${RADARR_METRICS}"
    restart: ${RESTART_POLICY}
    depends_on:
      - radarr

  qbittorrent-exporter:
    container_name: qbittorrent-exporter
    image: ghcr.io/martabal/qbittorrent-exporter:latest
    environment:
      QBITTORRENT_BASE_URL: http://qbittorrent:${QB_PORT}
      QBITTORRENT_USERNAME: ${QB_USER}
      QBITTORRENT_PASSWORD: ${QB_PW}
      EXPORTER_PORT: ${QBEXP_PORT}
    ports:
      - "${QBEXP_PORT}:${QBEXP_PORT}"
    restart: ${RESTART_POLICY}
    depends_on:
      - qbittorrent
    networks:
      - "${TRAEFIK_NETWORK}"
      - "default"
